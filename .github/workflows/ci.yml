name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  #  Backend Tests
  # ─────────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests (Python 3.12)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: suntax_test
          POSTGRES_PASSWORD: suntax_test_password
          POSTGRES_DB: suntax_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U suntax_test -d suntax_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql+asyncpg://suntax_test:suntax_test_password@localhost:5432/suntax_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci_test_secret_key_not_for_production_use
          ENVIRONMENT: test
        run: |
          alembic upgrade head

      - name: Run tests with pytest
        env:
          DATABASE_URL: postgresql+asyncpg://suntax_test:suntax_test_password@localhost:5432/suntax_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci_test_secret_key_not_for_production_use
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: test_access
          MINIO_SECRET_KEY: test_secret
          MINIO_BUCKET_NAME: test-bucket
          MINIO_USE_SSL: "false"
          GEMINI_API_KEY: fake_key_for_tests
          ENVIRONMENT: test
        run: |
          pytest \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short \
            -v \
            -x \
            --timeout=60 \
            tests/

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

  # ─────────────────────────────────────────────────────────────
  #  Frontend Tests
  # ─────────────────────────────────────────────────────────────
  frontend-test:
    name: Frontend Tests (Node 20)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest
        run: npm run test -- --coverage --reporter=verbose

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./frontend/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false

      - name: Build check
        env:
          NEXT_PUBLIC_API_URL: https://example.com/api/v1
          NEXT_PUBLIC_WS_URL: wss://example.com/ws
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  # ─────────────────────────────────────────────────────────────
  #  Security Scans
  # ─────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Install security tools
        run: |
          pip install bandit[toml] safety

      - name: Run Bandit (Python SAST)
        run: |
          bandit \
            -r backend/app/ \
            -ll \
            -ii \
            -f json \
            -o bandit-report.json \
            || true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

      - name: Check Python dependency vulnerabilities
        run: |
          safety check \
            -r backend/requirements.txt \
            --output text \
            || echo "::warning::Safety check found potential vulnerabilities"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit
        working-directory: ./frontend
        run: |
          npm audit --audit-level=high \
            || echo "::warning::npm audit found high-severity vulnerabilities"

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
