# ─────────────────────────────────────────────────────────────
#  SunTax – Nginx Reverse Proxy Configuration
#  Handles: HTTPS termination, WebSocket proxying, rate limiting,
#           security headers, gzip, and Let's Encrypt.
# ─────────────────────────────────────────────────────────────

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # ── Performance ───────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  75s;
    types_hash_max_size 2048;
    server_tokens      off;  # Hide Nginx version

    # ── Client Limits ─────────────────────────────────────────
    client_max_body_size        60m;   # Allow up to 60 MB uploads (tax documents)
    client_body_buffer_size     128k;
    client_header_buffer_size   1k;
    large_client_header_buffers 4 4k;

    # ── Gzip Compression ──────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        image/svg+xml
        font/opentype;

    # ── Rate Limiting ─────────────────────────────────────────
    limit_req_zone  $binary_remote_addr zone=api_limit:10m     rate=10r/s;
    limit_req_zone  $binary_remote_addr zone=login_limit:10m   rate=5r/m;
    limit_req_zone  $binary_remote_addr zone=upload_limit:10m  rate=2r/s;
    limit_req_status 429;

    # ── Upstream Definitions ──────────────────────────────────
    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend {
        server frontend:3000;
        keepalive 16;
    }

    # ── Security Headers Map ──────────────────────────────────
    map $sent_http_content_type $csp_header {
        default "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss:; frame-ancestors 'none';";
    }

    # ── HTTP → HTTPS Redirect ─────────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS Main Server ─────────────────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;

        server_name ${DOMAIN_NAME};

        # ── TLS Configuration ──────────────────────────────────
        ssl_certificate     /etc/letsencrypt/live/${DOMAIN_NAME}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${DOMAIN_NAME}/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/${DOMAIN_NAME}/chain.pem;

        ssl_session_timeout  1d;
        ssl_session_cache    shared:SSL:10m;
        ssl_session_tickets  off;

        # Modern TLS only
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;

        ssl_dhparam          /etc/nginx/dhparam.pem;

        # OCSP Stapling
        ssl_stapling         on;
        ssl_stapling_verify  on;
        resolver             8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout     5s;

        # ── Security Headers ───────────────────────────────────
        add_header Strict-Transport-Security   "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options             "DENY" always;
        add_header X-Content-Type-Options      "nosniff" always;
        add_header X-XSS-Protection            "1; mode=block" always;
        add_header Referrer-Policy             "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy          "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy     $csp_header always;

        # ── API Routes → FastAPI Backend ───────────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass         http://backend;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            proxy_read_timeout    120s;
            proxy_connect_timeout 10s;
            proxy_send_timeout    120s;

            proxy_buffering    on;
            proxy_buffer_size  4k;
            proxy_buffers      8 4k;
        }

        # ── Login endpoint – stricter rate limit ───────────────
        location /api/v1/auth/login {
            limit_req zone=login_limit burst=5 nodelay;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        # ── File upload endpoint ───────────────────────────────
        location /api/v1/documents/upload {
            limit_req zone=upload_limit burst=4 nodelay;
            client_max_body_size 60m;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            proxy_read_timeout 300s;  # Longer timeout for large uploads
        }

        # ── WebSocket Routes ───────────────────────────────────
        location /ws/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;

            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout    3600s;  # 1 hour for long-lived WS connections
            proxy_send_timeout    3600s;
            proxy_connect_timeout 10s;
        }

        # ── OpenAPI docs (development only — block in prod via env) ──
        location ~ ^/(docs|redoc|openapi.json)$ {
            # Uncomment to block API docs in production:
            # return 403;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }

        # ── Static assets (long cache) ─────────────────────────
        location /_next/static/ {
            proxy_pass         http://frontend;
            proxy_cache_valid  200 365d;
            add_header         Cache-Control "public, max-age=31536000, immutable";
        }

        # ── Next.js Frontend (everything else) ────────────────
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            proxy_read_timeout    60s;
            proxy_connect_timeout 10s;
        }

        # ── Custom error pages ─────────────────────────────────
        error_page 429 /429.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html  { root /usr/share/nginx/html; internal; }
        location = /429.html  { root /usr/share/nginx/html; internal; }
    }
}
