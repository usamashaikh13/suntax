version: "3.9"

# ─────────────────────────────────────────────────────────────
#  SunTax – Development Docker Compose
#  Bring up:  docker compose up --build
# ─────────────────────────────────────────────────────────────

networks:
  suntax_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:

services:
  # ── PostgreSQL 16 ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: suntax_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-suntax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-suntax_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-suntax}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - suntax_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-suntax} -d ${POSTGRES_DB:-suntax}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Redis 7 ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: suntax_redis
    restart: unless-stopped
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - suntax_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── MinIO Object Storage ──────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: suntax_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-suntax_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-suntax_minio_secret}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console
    networks:
      - suntax_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s

  # ── MinIO bucket init (one-shot) ──────────────────────────────
  minio_init:
    image: minio/mc:latest
    container_name: suntax_minio_init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - suntax_net
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-suntax_minio} ${MINIO_SECRET_KEY:-suntax_minio_secret};
        mc mb --ignore-existing local/${MINIO_BUCKET_NAME:-suntax-documents};
        mc anonymous set none local/${MINIO_BUCKET_NAME:-suntax-documents};
        exit 0;
      "

  # ── FastAPI Backend ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: suntax_backend
    restart: unless-stopped
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app
      --log-level debug
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-suntax}:${POSTGRES_PASSWORD:-suntax_dev_password}@postgres:5432/${POSTGRES_DB:-suntax}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-suntax_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-suntax_minio_secret}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-suntax-documents}
      MINIO_USE_SSL: "false"
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key_change_in_production_please}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@localhost}
      ENVIRONMENT: development
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    networks:
      - suntax_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Celery Worker ─────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: suntax_worker
    restart: unless-stopped
    command: >
      celery -A app.worker.celery_app worker
      --loglevel=info
      --concurrency=4
      --queues=celery,ai_tasks,document_processing
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-suntax}:${POSTGRES_PASSWORD:-suntax_dev_password}@postgres:5432/${POSTGRES_DB:-suntax}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-suntax_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-suntax_minio_secret}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-suntax-documents}
      MINIO_USE_SSL: "false"
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key_change_in_production_please}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ENVIRONMENT: development
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - ./backend:/app
    networks:
      - suntax_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ── Celery Beat Scheduler ─────────────────────────────────────
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: suntax_beat
    restart: unless-stopped
    command: >
      celery -A app.worker.celery_app beat
      --loglevel=info
      --scheduler redbeat.RedBeatScheduler
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-suntax}:${POSTGRES_PASSWORD:-suntax_dev_password}@postgres:5432/${POSTGRES_DB:-suntax}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key_change_in_production_please}
      ENVIRONMENT: development
    volumes:
      - ./backend:/app
    networks:
      - suntax_net
    depends_on:
      - redis
      - backend

  # ── Next.js Frontend (dev) ────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: suntax_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    networks:
      - suntax_net
    depends_on:
      backend:
        condition: service_healthy
